<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#FFFFFF"/><text x="60" y="76" font-family="Montserrat" font-size="30" font-weight="700" fill="#2B2B2B" letter-spacing="1" text-anchor="start" opacity="1">HỆ THỐNG KIỂU CHỮ</text><line x1="60" y1="98" x2="1140" y2="98" stroke="#C9A24B" stroke-width="2"/><text x="60" y="150" font-family="Montserrat" font-size="22" font-weight="700" fill="#0F6B50" letter-spacing="0" text-anchor="start" opacity="1">Kiểu chữ tiêu đề</text><text x="60" y="216" font-family="Montserrat" font-size="52" font-weight="700" fill="#2B2B2B">SYNETIC</text><text x="60" y="256" font-family="Montserrat" font-size="24" font-weight="600" fill="#2B2B2B">KIẾN TẠO GIÁ TRỊ VƯỢT TRỘI</text><text x="60" y="290" font-family="Inter" font-size="17" font-weight="400" fill="#2B2B2B" letter-spacing="0" text-anchor="start" opacity="0.65">Montserrat SemiBold / Bold</text><text x="820" y="216" font-family="Montserrat" font-size="70" font-weight="600" fill="#0F6B50">Aa</text><text x="820" y="250" font-family="Inter" font-size="13" font-weight="500" fill="#2B2B2B" letter-spacing="0" text-anchor="start" opacity="1">ABCDEFGHIJKLMNOPQRSTUVWXYZ</text><text x="820" y="272" font-family="Inter" font-size="13" font-weight="500" fill="#2B2B2B" letter-spacing="0" text-anchor="start" opacity="1">0123456789   ĂÂĐÊÔƠƯ</text><line x1="60" y1="330" x2="1140" y2="330" stroke="#E6E6E6" stroke-width="1.5"/><text x="60" y="382" font-family="Montserrat" font-size="22" font-weight="700" fill="#0F6B50" letter-spacing="0" text-anchor="start" opacity="1">Kiểu chữ nội dung</text><text x="60" y="424" font-family="Inter" font-size="19" font-weight="400" fill="#2B2B2B" letter-spacing="0" text-anchor="start" opacity="0.85">Synetic cam kết kiến tạo giá trị vượt trội thông qua đổi mới, kết nối</text><text x="60" y="454" font-family="Inter" font-size="19" font-weight="400" fill="#2B2B2B" letter-spacing="0" text-anchor="start" opacity="0.85">và hợp tác bền vững. Chúng tôi đồng hành cùng đối tác và khách hàng</text><text x="60" y="484" font-family="Inter" font-size="19" font-weight="400" fill="#2B2B2B" letter-spacing="0" text-anchor="start" opacity="0.85">để phát triển thịnh vượng, hướng tới tương lai tốt đẹp hơn.</text><text x="60" y="540" font-family="Inter" font-size="17" font-weight="400" fill="#2B2B2B" letter-spacing="0" text-anchor="start" opacity="0.65">Inter Regular / Medium</text><text x="820" y="430" font-family="Inter" font-size="70" font-weight="400" fill="#0F6B50">Aa</text><text x="820" y="464" font-family="Inter" font-size="13" font-weight="400" fill="#2B2B2B" letter-spacing="0" text-anchor="start" opacity="1">ABCDEFGHIJKLMNOPQRSTUVWXYZ</text><text x="820" y="486" font-family="Inter" font-size="13" font-weight="400" fill="#2B2B2B" letter-spacing="0" text-anchor="start" opacity="1">abcdefghijklmnopqrstuvwxyz</text><text x="820" y="508" font-family="Inter" font-size="13" font-weight="400" fill="#2B2B2B" letter-spacing="0" text-anchor="start" opacity="1">0123456789   ăâđêôơư</text><line x1="60" y1="590" x2="1140" y2="590" stroke="#E6E6E6" stroke-width="1.5"/><text x="60" y="632" font-family="Inter" font-size="17" font-weight="400" fill="#2B2B2B" letter-spacing="0" text-anchor="start" opacity="0.75">Chữ thay thế khi máy không có font: Arial (Windows/Office) · Helvetica (macOS).</text><text x="60" y="662" font-family="Inter" font-size="17" font-weight="400" fill="#2B2B2B" letter-spacing="0" text-anchor="start" opacity="0.75">Không dùng Times New Roman cho ấn phẩm thương hiệu.</text></svg>
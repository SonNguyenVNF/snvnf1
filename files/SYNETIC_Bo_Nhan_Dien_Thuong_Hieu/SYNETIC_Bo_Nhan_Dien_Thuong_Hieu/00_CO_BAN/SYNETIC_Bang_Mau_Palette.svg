<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620"><rect width="1400" height="620" fill="#FFFFFF"/><text x="70" y="84" font-family="Be Vietnam Pro" font-size="38" font-weight="800" fill="#08322F" letter-spacing="1" text-anchor="start" opacity="1">BẢNG MÀU SYNETIC</text><text x="70" y="122" font-family="Be Vietnam Pro" font-size="19" font-weight="400" fill="#08322F" letter-spacing="0" text-anchor="start" opacity="0.7">Toàn hệ thống chỉ dùng 4 màu. Không ánh kim, chrome, bạc hay xám kim loại (Kim khắc Mộc).</text><rect x="70" y="172" width="620" height="150" rx="8" fill="#0B7A6E"/><text x="102" y="228" font-family="Be Vietnam Pro" font-size="24" font-weight="800" fill="#FFFFFF" letter-spacing="0.8" text-anchor="start" opacity="1">NGỌC SYNETIC</text><text x="102" y="260" font-family="Be Vietnam Pro" font-size="18" font-weight="500" fill="#FFFFFF" letter-spacing="0" text-anchor="start" opacity="0.9">#0B7A6E</text><text x="102" y="290" font-family="Be Vietnam Pro" font-size="15" font-weight="400" fill="#FFFFFF" letter-spacing="0" text-anchor="start" opacity="0.85">Thuỷ sinh Mộc — màu chủ đạo</text><text x="658" y="228" font-family="Be Vietnam Pro" font-size="22" font-weight="800" fill="#FFFFFF" letter-spacing="0" text-anchor="end" opacity="0.9">55%</text><rect x="730" y="172" width="620" height="150" rx="8" fill="#57B94F"/><text x="762" y="228" font-family="Be Vietnam Pro" font-size="24" font-weight="800" fill="#08322F" letter-spacing="0.8" text-anchor="start" opacity="1">LỤC TIẾN</text><text x="762" y="260" font-family="Be Vietnam Pro" font-size="18" font-weight="500" fill="#08322F" letter-spacing="0" text-anchor="start" opacity="0.9">#57B94F</text><text x="762" y="290" font-family="Be Vietnam Pro" font-size="15" font-weight="400" fill="#08322F" letter-spacing="0" text-anchor="start" opacity="0.85">Mộc tươi — tăng trưởng</text><text x="1318" y="228" font-family="Be Vietnam Pro" font-size="22" font-weight="800" fill="#08322F" letter-spacing="0" text-anchor="end" opacity="0.9">18%</text><rect x="70" y="362" width="620" height="150" rx="8" fill="#FFC233"/><text x="102" y="418" font-family="Be Vietnam Pro" font-size="24" font-weight="800" fill="#08322F" letter-spacing="0.8" text-anchor="start" opacity="1">VÀNG NẮNG</text><text x="102" y="450" font-family="Be Vietnam Pro" font-size="18" font-weight="500" fill="#08322F" letter-spacing="0" text-anchor="start" opacity="0.9">#FFC233</text><text x="102" y="480" font-family="Be Vietnam Pro" font-size="15" font-weight="400" fill="#08322F" letter-spacing="0" text-anchor="start" opacity="0.85">Thổ — tài tinh, điểm nhấn</text><text x="658" y="418" font-family="Be Vietnam Pro" font-size="22" font-weight="800" fill="#08322F" letter-spacing="0" text-anchor="end" opacity="0.9">15%</text><rect x="730" y="362" width="620" height="150" rx="8" fill="#08322F"/><text x="762" y="418" font-family="Be Vietnam Pro" font-size="24" font-weight="800" fill="#FFFFFF" letter-spacing="0.8" text-anchor="start" opacity="1">XANH THẲM</text><text x="762" y="450" font-family="Be Vietnam Pro" font-size="18" font-weight="500" fill="#FFFFFF" letter-spacing="0" text-anchor="start" opacity="0.9">#08322F</text><text x="762" y="480" font-family="Be Vietnam Pro" font-size="15" font-weight="400" fill="#FFFFFF" letter-spacing="0" text-anchor="start" opacity="0.85">Thuỷ đậm — chữ, nền tối</text><text x="1318" y="418" font-family="Be Vietnam Pro" font-size="22" font-weight="800" fill="#FFFFFF" letter-spacing="0" text-anchor="end" opacity="0.9">12%</text><rect x="70" y="556" width="1260" height="46" rx="8" fill="#F4FAF7" stroke="#DCEFE9" stroke-width="2"/><text x="96" y="585" font-family="Be Vietnam Pro" font-size="17" font-weight="600" fill="#08322F" letter-spacing="0" text-anchor="start" opacity="0.8">TRẮNG NGỌC  #F4FAF7 — nền hệ thống    ·    NGỌC SƯƠNG  #DCEFE9 — nền phụ, kẻ bảng</text></svg>
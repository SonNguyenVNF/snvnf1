<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640"><rect width="1400" height="640" fill="#FFFFFF"/><text x="70" y="80" font-family="Be Vietnam Pro" font-size="36" font-weight="800" fill="#08322F" letter-spacing="1" text-anchor="start" opacity="1">KIẾN TRÚC THÔNG ĐIỆP THƯƠNG HIỆU</text><text x="70" y="118" font-family="Be Vietnam Pro" font-size="19" font-weight="400" fill="#08322F" letter-spacing="0" text-anchor="start" opacity="0.7">Sáu câu không cạnh tranh nhau — chúng là sáu tầng của cùng một hệ tư tưởng.</text><rect x="70" y="164" width="1260" height="60" rx="6" fill="#F4FAF7"/><rect x="70" y="164" width="10" height="60" rx="5" fill="#0B7A6E"/><text x="102" y="190" font-family="Be Vietnam Pro" font-size="13" font-weight="700" fill="#0B7A6E" letter-spacing="2" text-anchor="start" opacity="1">TẦNG 1 · BRAND PROMISE</text><text x="102" y="212" font-family="Be Vietnam Pro" font-size="21" font-weight="800" fill="#08322F" letter-spacing="0.8" text-anchor="start" opacity="1">KIẾN TẠO GIÁ TRỊ VƯỢT TRỘI</text><text x="1306" y="202" font-family="Be Vietnam Pro" font-size="16" font-weight="500" fill="#08322F" letter-spacing="0" text-anchor="end" opacity="0.6">Slogan chính thức</text><rect x="70" y="238" width="1260" height="60" rx="6" fill="#F4FAF7"/><rect x="70" y="238" width="10" height="60" rx="5" fill="#57B94F"/><text x="102" y="264" font-family="Be Vietnam Pro" font-size="13" font-weight="700" fill="#57B94F" letter-spacing="2" text-anchor="start" opacity="1">TẦNG 2 · TẦM NHÌN</text><text x="102" y="286" font-family="Be Vietnam Pro" font-size="21" font-weight="800" fill="#08322F" letter-spacing="0.8" text-anchor="start" opacity="1">MỞ LỐI PHỒN VINH</text><text x="1306" y="276" font-family="Be Vietnam Pro" font-size="16" font-weight="500" fill="#08322F" letter-spacing="0" text-anchor="end" opacity="0.6">Vision Statement — không cạnh logo</text><rect x="70" y="312" width="1260" height="60" rx="6" fill="#F4FAF7"/><rect x="70" y="312" width="10" height="60" rx="5" fill="#FFC233"/><text x="102" y="338" font-family="Be Vietnam Pro" font-size="13" font-weight="700" fill="#A87400" letter-spacing="2" text-anchor="start" opacity="1">TẦNG 3 · KHÁCH HÀNG</text><text x="102" y="360" font-family="Be Vietnam Pro" font-size="21" font-weight="800" fill="#08322F" letter-spacing="0.8" text-anchor="start" opacity="1">PHỤNG SỰ KHÁCH HÀNG – KIẾN TẠO THÀNH CÔNG</text><text x="1306" y="350" font-family="Be Vietnam Pro" font-size="16" font-weight="500" fill="#08322F" letter-spacing="0" text-anchor="end" opacity="0.6">Lý do tồn tại</text><rect x="70" y="386" width="1260" height="60" rx="6" fill="#F4FAF7"/><rect x="70" y="386" width="10" height="60" rx="5" fill="#57B94F"/><text x="102" y="412" font-family="Be Vietnam Pro" font-size="13" font-weight="700" fill="#57B94F" letter-spacing="2" text-anchor="start" opacity="1">TẦNG 4 · VĂN HOÁ</text><text x="102" y="434" font-family="Be Vietnam Pro" font-size="21" font-weight="800" fill="#08322F" letter-spacing="0.8" text-anchor="start" opacity="1">CHUYỂN ĐỘNG KHÔNG NGỪNG VÌ CUỘC SỐNG</text><text x="1306" y="424" font-family="Be Vietnam Pro" font-size="16" font-weight="500" fill="#08322F" letter-spacing="0" text-anchor="end" opacity="0.6">Tinh thần hành động</text><rect x="70" y="460" width="1260" height="60" rx="6" fill="#F4FAF7"/><rect x="70" y="460" width="10" height="60" rx="5" fill="#57B94F"/><text x="102" y="486" font-family="Be Vietnam Pro" font-size="13" font-weight="700" fill="#57B94F" letter-spacing="2" text-anchor="start" opacity="1">TẦNG 5 · KHÁT VỌNG</text><text x="102" y="508" font-family="Be Vietnam Pro" font-size="21" font-weight="800" fill="#08322F" letter-spacing="0.8" text-anchor="start" opacity="1">VƯƠN TẦM BẰNG KHÁT VỌNG</text><text x="1306" y="498" font-family="Be Vietnam Pro" font-size="16" font-weight="500" fill="#08322F" letter-spacing="0" text-anchor="end" opacity="0.6">Động lực phát triển</text><rect x="70" y="534" width="1260" height="60" rx="6" fill
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700"><rect width="1400" height="700" fill="#FFFFFF"/><text x="70" y="84" font-family="Be Vietnam Pro" font-size="38" font-weight="800" fill="#08322F" letter-spacing="1" text-anchor="start" opacity="1">HỆ THỐNG KIỂU CHỮ</text><text x="70" y="124" font-family="Be Vietnam Pro" font-size="20" font-weight="500" fill="#0B7A6E" letter-spacing="0" text-anchor="start" opacity="1">Be Vietnam Pro — bộ chữ miễn phí, thiết kế riêng cho hệ thống dấu tiếng Việt.</text><text x="70" y="200" font-family="Be Vietnam Pro" font-size="14" font-weight="500" fill="#FFC233" letter-spacing="2" text-anchor="start" opacity="1">ExtraBold 800</text><text x="290" y="208" font-family="Be Vietnam Pro" font-size="48" font-weight="800" fill="#08322F" letter-spacing="0" text-anchor="start" opacity="1">KIẾN TẠO GIÁ TRỊ VƯỢT TRỘI</text><text x="70" y="292" font-family="Be Vietnam Pro" font-size="14" font-weight="500" fill="#FFC233" letter-spacing="2" text-anchor="start" opacity="1">Bold 700</text><text x="290" y="300" font-family="Be Vietnam Pro" font-size="38" font-weight="700" fill="#08322F" letter-spacing="0" text-anchor="start" opacity="1">Tiêu đề mục · Heading</text><text x="70" y="384" font-family="Be Vietnam Pro" font-size="14" font-weight="500" fill="#FFC233" letter-spacing="2" text-anchor="start" opacity="1">SemiBold 600</text><text x="290" y="392" font-family="Be Vietnam Pro" font-size="29" font-weight="600" fill="#08322F" letter-spacing="0" text-anchor="start" opacity="1">Tiêu đề phụ · Subheading</text><text x="70" y="476" font-family="Be Vietnam Pro" font-size="14" font-weight="500" fill="#FFC233" letter-spacing="2" text-anchor="start" opacity="1">Medium 500</text><text x="290" y="484" font-family="Be Vietnam Pro" font-size="23" font-weight="500" fill="#08322F" letter-spacing="0" text-anchor="start" opacity="1">Chữ dẫn · Lead paragraph</text><text x="70" y="568" font-family="Be Vietnam Pro" font-size="14" font-weight="500" fill="#FFC233" letter-spacing="2" text-anchor="start" opacity="1">Regular 400</text><text x="290" y="576" font-family="Be Vietnam Pro" font-size="19" font-weight="400" fill="#08322F" letter-spacing="0" text-anchor="start" opacity="1">Chữ nội dung: kiến tạo giá trị vượt trội cho khách hàng, đối tác và cộng đồng.</text><line x1="70" y1="636" x2="1330" y2="636" stroke="#DCEFE9" stroke-width="2"/><text x="70" y="672" font-family="Be Vietnam Pro" font-size="17" font-weight="400" fill="#08322F" letter-spacing="0" text-anchor="start" opacity="0.78">Chữ thay thế khi máy không có font: Arial (Windows/Office) · Helvetica (macOS). Không dùng Times New Roman cho ấn phẩm thương hiệu.</text></svg>
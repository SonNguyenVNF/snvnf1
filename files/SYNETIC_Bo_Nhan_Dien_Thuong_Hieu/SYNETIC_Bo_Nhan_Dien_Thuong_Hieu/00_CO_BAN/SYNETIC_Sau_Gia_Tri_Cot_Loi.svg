<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820"><rect width="1400" height="820" fill="#F4FAF7"/><g transform="translate(636,10) scale(0.62)"><g transform="translate(100,100) rotate(0) translate(6,6)"><path d="M0 0 C30 -8 52 14 46 46 C14 52 -8 30 0 0 Z" fill="#0B7A6E"/></g><g transform="translate(100,100) rotate(120) translate(6,6)"><path d="M0 0 C30 -8 52 14 46 46 C14 52 -8 30 0 0 Z" fill="#57B94F"/></g><g transform="translate(100,100) rotate(240) translate(6,6)"><path d="M0 0 C30 -8 52 14 46 46 C14 52 -8 30 0 0 Z" fill="#FFC233"/></g></g><text x="700" y="168" font-family="Be Vietnam Pro" font-size="38" font-weight="800" fill="#08322F" letter-spacing="1" text-anchor="middle" opacity="1">SÁU GIÁ TRỊ CỐT LÕI</text><text x="700" y="206" font-family="Be Vietnam Pro" font-size="19" font-weight="400" fill="#08322F" letter-spacing="0" text-anchor="middle" opacity="0.7">Sáu tầng của cùng một hệ tư tưởng, không cạnh tranh nhau</text><rect x="80" y="250" width="380" height="210" rx="8" fill="#FFFFFF"/><rect x="80" y="250" width="380" height="5" rx="2.5" fill="#0B7A6E"/><text x="108" y="312" font-family="Be Vietnam Pro" font-size="26" font-weight="800" fill="#FFC233" letter-spacing="1" text-anchor="start" opacity="1">01</text><text x="104" y="378" font-family="Be Vietnam Pro" font-size="28" font-weight="800" fill="#0B7A6E" letter-spacing="1.2" text-anchor="start" opacity="1">KHÁT VỌNG</text><text x="104" y="412" font-family="Be Vietnam Pro" font-size="16" font-weight="500" fill="#08322F" letter-spacing="0" text-anchor="start" opacity="0.78">Nghĩ lớn – Làm lớn – Đi xa</text><rect x="500" y="250" width="380" height="210" rx="8" fill="#FFFFFF"/><rect x="500" y="250" width="380" height="5" rx="2.5" fill="#57B94F"/><text x="528" y="312" font-family="Be Vietnam Pro" font-size="26" font-weight="800" fill="#FFC233" letter-spacing="1" text-anchor="start" opacity="1">02</text><text x="524" y="378" font-family="Be Vietnam Pro" font-size="28" font-weight="800" fill="#57B94F" letter-spacing="1.2" text-anchor="start" opacity="1">TIÊN PHONG</text><text x="524" y="412" font-family="Be Vietnam Pro" font-size="16" font-weight="500" fill="#08322F" letter-spacing="0" text-anchor="start" opacity="0.78">Không theo cuộc chơi – Tạo cuộc chơi</text><rect x="920" y="250" width="380" height="210" rx="8" fill="#FFFFFF"/><rect x="920" y="250" width="380" height="5" rx="2.5" fill="#FFC233"/><text x="948" y="312" font-family="Be Vietnam Pro" font-size="26" font-weight="800" fill="#FFC233" letter-spacing="1" text-anchor="start" opacity="1">03</text><text x="944" y="378" font-family="Be Vietnam Pro" font-size="28" font-weight="800" fill="#0B7A6E" letter-spacing="1.2" text-anchor="start" opacity="1">CHUYỂN ĐỘNG</text><text x="944" y="412" font-family="Be Vietnam Pro" font-size="16" font-weight="500" fill="#08322F" letter-spacing="0" text-anchor="start" opacity="0.78">Không ngừng tốt hơn</text><rect x="80" y="500" width="380" height="210" rx="8" fill="#FFFFFF"/><rect x="80" y="500" width="380" height="5" rx="2.5" fill="#0B7A6E"/><text x="108" y="562" font-family="Be Vietnam Pro" font-size="26" font-weight="800" fill="#FFC233" letter-spacing="1" text-anchor="start" opacity="1">04</text><text x="104" y="628" font-family="Be Vietnam Pro" font-size="28" font-weight="800" fill="#57B94F" letter-spacing="1.2" text-anchor="start" opacity="1">PHỤNG SỰ</text><text x="104" y="662" font-family="Be Vietnam Pro" font-size="16" font-weight="500" fill="#08322F" letter-spacing="0" text-anchor="start" opacity="0.78">Thành công của khách hàng là thước đo</text><rect x="500" y="500" width="380" height="210" rx="8" fill="#FFFFFF"/><rect x="500" y="500" width="380" height="5" rx="2.5" fill="#57B94F"/><text x="528" y="562" font-family="Be Vietnam Pro" font-size="26" font-weight="800" fill="#FFC233" letter-spacing="1" text-anchor="start" opacity="1">05</text><text x="524" y="628" font-family="Be Vietnam Pro" font-size="28" font-weight="800" fill="#0B7A6E"
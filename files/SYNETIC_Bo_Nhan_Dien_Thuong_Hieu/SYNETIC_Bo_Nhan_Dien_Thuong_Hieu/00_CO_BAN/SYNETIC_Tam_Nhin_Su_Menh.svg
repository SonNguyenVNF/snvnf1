<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720"><rect width="1400" height="720" fill="#FFFFFF"/><text x="70" y="84" font-family="Be Vietnam Pro" font-size="38" font-weight="800" fill="#08322F" letter-spacing="1" text-anchor="start" opacity="1">TẦM NHÌN — SỨ MỆNH</text><text x="70" y="122" font-family="Be Vietnam Pro" font-size="19" font-weight="400" fill="#08322F" letter-spacing="0" text-anchor="start" opacity="0.7">Hai câu định hướng toàn hệ thống Synetic.</text><rect x="70" y="170" width="620" height="470" rx="12" fill="#0B7A6E"/><text x="106" y="224" font-family="Be Vietnam Pro" font-size="15" font-weight="700" fill="#FFC233" letter-spacing="5" text-anchor="start" opacity="1">TẦM NHÌN</text><text x="106" y="282" font-family="Be Vietnam Pro" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="4" text-anchor="start" opacity="1">MỞ LỐI PHỒN VINH</text><line x1="106" y1="312" x2="230" y2="312" stroke="#FFC233" stroke-width="3"/><text x="106" y="362" font-family="Be Vietnam Pro" font-size="17" font-weight="400" fill="#FFFFFF" letter-spacing="0" text-anchor="start" opacity="0.88">Trở thành hệ sinh thái kinh doanh tích hợp hàng đầu</text><text x="106" y="394" font-family="Be Vietnam Pro" font-size="17" font-weight="400" fill="#FFFFFF" letter-spacing="0" text-anchor="start" opacity="0.88">Việt Nam trong nông nghiệp, dinh dưỡng, dịch vụ chuỗi</text><text x="106" y="426" font-family="Be Vietnam Pro" font-size="17" font-weight="400" fill="#FFFFFF" letter-spacing="0" text-anchor="start" opacity="0.88">cung ứng và đầu tư; tiên phong tạo ra những mô hình</text><text x="106" y="458" font-family="Be Vietnam Pro" font-size="17" font-weight="400" fill="#FFFFFF" letter-spacing="0" text-anchor="start" opacity="0.88">kinh doanh hiệu quả, khác biệt và bền vững, góp phần</text><text x="106" y="490" font-family="Be Vietnam Pro" font-size="17" font-weight="400" fill="#FFFFFF" letter-spacing="0" text-anchor="start" opacity="0.88">nâng cao năng lực của doanh nghiệp Việt Nam và kiến</text><text x="106" y="522" font-family="Be Vietnam Pro" font-size="17" font-weight="400" fill="#FFFFFF" letter-spacing="0" text-anchor="start" opacity="0.88">tạo một tương lai thịnh vượng cho cộng đồng.</text><rect x="710" y="170" width="620" height="470" rx="12" fill="#F4FAF7" stroke="#DCEFE9" stroke-width="2"/><text x="746" y="224" font-family="Be Vietnam Pro" font-size="15" font-weight="700" fill="#57B94F" letter-spacing="5" text-anchor="start" opacity="1">SỨ MỆNH</text><text x="746" y="274" font-family="Be Vietnam Pro" font-size="27" font-weight="800" fill="#0B7A6E" letter-spacing="1" text-anchor="start" opacity="1">Phụng sự khách hàng</text><text x="746" y="308" font-family="Be Vietnam Pro" font-size="27" font-weight="800" fill="#0B7A6E" letter-spacing="1" text-anchor="start" opacity="1">Kiến tạo thành công</text><text x="746" y="342" font-family="Be Vietnam Pro" font-size="27" font-weight="800" fill="#0B7A6E" letter-spacing="1" text-anchor="start" opacity="1">Lan toả thịnh vượng</text><line x1="746" y1="392" x2="870" y2="392" stroke="#FFC233" stroke-width="3"/><circle cx="756" cy="427" r="5" fill="#FFC233"/><text x="774" y="432" font-family="Be Vietnam Pro" font-size="16" font-weight="700" fill="#0B7A6E" letter-spacing="0" text-anchor="start" opacity="1">Khách hàng</text><text x="918" y="432" font-family="Be Vietnam Pro" font-size="15" font-weight="400" fill="#08322F" letter-spacing="0" text-anchor="start" opacity="0.8">Sản phẩm và dịch vụ tốt hơn kỳ vọng.</text><circle cx="756" cy="469" r="5" fill="#FFC233"/><text x="774" y="474" font-family="Be Vietnam Pro" font-size="16" font-weight="700" fill="#0B7A6E" letter-spacing="0" text-anchor="start" opacity="1">Đối tác</text><text x="918" y="474" font-family="Be Vietnam Pro" font-size="15" font-weight="400" fill="#08322F" letter-spacing="0" text-anchor="start" opacity="0.8">Cùng phát triển, không chỉ mua – bán.</text><circle cx="756" cy="511" r="5" fill="#FFC233"/><text x="774" y="516" font-family="Be Vietnam Pro" font-size="16" font-weight="700" fill="#0B7A6E" letter-spacing="0" text-anchor="start" opacity="1">Người lao động</text><text x="918" y="516" font-family="Be Vietnam Pro" font-size="15" font-weight="400" fill="#08322F" letter-spacing="0" text-anchor="start" opacity="0.8">Môi trường phát triển năng lực và cuộc sống.</text><circle cx="756" cy="553" r="5" fill="#FFC233"/><text x="774" y="558" font-family="Be Vietnam Pro" font-size="16" font-weight="700" fill="#0B7A6E" letter-spacing="0" text-anchor="start" opacity="1">Cổ đông</text><text x="918" y="558" font-family="Be Vietnam Pro" font-size="15" font-weight="400" fill="#08322F" letter-spacing="0" text-anchor="start" opacity="0.8">Tăng trưởng có chất lượng, giá trị bền vững.</text><circle cx="756" cy="595" r="5" fill="#FFC233"/><text x="774" y="600" font-family="Be Vietnam Pro" font-size="16" font-weight="700" fill="#0B7A6E" letter-spacing="0" text-anchor="start" opacity="1">Cộng đồng</text><text x="918" y="600" font-family="Be Vietnam Pro" font-size="15" font-weight="400" fill="#08322F" letter-spacing="0" text-anchor="start" opacity="0.8">Việc làm, ngân sách, năng suất, giá trị tích cực.</text><rect x="70" y="662" width="1260" height="42" rx="8" fill="#DCEFE9"/><text x="700" y="690" font-family="Be Vietnam Pro" font-size="17" font-weight="700" fill="#0B7A6E" letter-spacing="0.6" text-anchor="middle" opacity="1">Tạo giá trị vượt trội  ·  Tạo lợi thế khác biệt  ·  Tạo tăng trưởng bền vững  ·  Tạo thịnh vượng được chia sẻ</text></svg>
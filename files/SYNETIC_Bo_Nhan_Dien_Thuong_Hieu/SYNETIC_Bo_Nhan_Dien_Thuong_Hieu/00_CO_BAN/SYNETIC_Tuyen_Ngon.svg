<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500"><rect width="1200" height="1500" fill="#0B7A6E"/><g transform="translate(500,90) scale(1.0)"><g transform="translate(100,100) rotate(0) translate(6,6)"><path d="M0 0 C30 -8 52 14 46 46 C14 52 -8 30 0 0 Z" fill="#FFFFFF"/></g><g transform="translate(100,100) rotate(120) translate(6,6)"><path d="M0 0 C30 -8 52 14 46 46 C14 52 -8 30 0 0 Z" fill="#BFE6DD"/></g><g transform="translate(100,100) rotate(240) translate(6,6)"><path d="M0 0 C30 -8 52 14 46 46 C14 52 -8 30 0 0 Z" fill="#FFC233"/></g></g><text x="600" y="360" font-family="Be Vietnam Pro" font-size="22" font-weight="700" fill="#FFC233" letter-spacing="10" text-anchor="middle" opacity="1">LỜI TUYÊN NGÔN</text><text x="600" y="418" font-family="Be Vietnam Pro" font-size="62" font-weight="800" fill="#FFFFFF" letter-spacing="12" text-anchor="middle" opacity="1">SYNETIC</text><line x1="500" y1="462" x2="700" y2="462" stroke="#FFC233" stroke-width="3"/><text x="600" y="552" font-family="Be Vietnam Pro" font-size="24" font-weight="400" fill="#FFFFFF" letter-spacing="0.6" text-anchor="middle" opacity="0.9">Chúng tôi tin vào sức mạnh của khát vọng.</text><text x="600" y="612" font-family="Be Vietnam Pro" font-size="24" font-weight="400" fill="#FFFFFF" letter-spacing="0.6" text-anchor="middle" opacity="0.9">Tin rằng mọi giới hạn đều có thể được vượt qua bằng tư duy mới,</text><text x="600" y="672" font-family="Be Vietnam Pro" font-size="24" font-weight="400" fill="#FFFFFF" letter-spacing="0.6" text-anchor="middle" opacity="0.9">năng lực mới và cách làm tốt hơn.</text><text x="600" y="732" font-family="Be Vietnam Pro" font-size="24" font-weight="400" fill="#FFFFFF" letter-spacing="0.6" text-anchor="middle" opacity="0.9">Chúng tôi không ngừng chuyển động để tạo ra những sản phẩm tốt hơn,</text><text x="600" y="792" font-family="Be Vietnam Pro" font-size="24" font-weight="400" fill="#FFFFFF" letter-spacing="0.6" text-anchor="middle" opacity="0.9">những dịch vụ hiệu quả hơn và những cơ hội lớn hơn.</text><text x="600" y="852" font-family="Be Vietnam Pro" font-size="24" font-weight="400" fill="#FFFFFF" letter-spacing="0.6" text-anchor="middle" opacity="0.9">Chúng tôi đặt khách hàng vào trung tâm của mọi quyết định.</text><text x="600" y="912" font-family="Be Vietnam Pro" font-size="24" font-weight="400" fill="#FFFFFF" letter-spacing="0.6" text-anchor="middle" opacity="0.9">Chúng tôi kết nối những năng lực khác biệt thành một sức mạnh chung.</text><text x="600" y="972" font-family="Be Vietnam Pro" font-size="27" font-weight="800" fill="#FFC233" letter-spacing="0.6" text-anchor="middle" opacity="1">Chúng tôi tiên phong không phải để trở nên khác biệt,</text><text x="600" y="1036" font-family="Be Vietnam Pro" font-size="27" font-weight="800" fill="#FFC233" letter-spacing="0.6" text-anchor="middle" opacity="1">mà để tạo ra giá trị vượt trội.</text><rect x="320" y="1150" width="560" height="70" rx="10" fill="#FFFFFF"/><text x="600" y="1196" font-family="Be Vietnam Pro" font-size="22" font-weight="800" fill="#0B7A6E" letter-spacing="2.4" text-anchor="middle" opacity="1">KIẾN TẠO GIÁ TRỊ VƯỢT TRỘI</text><text x="600" y="1268" font-family="Be Vietnam Pro" font-size="16" font-weight="600" fill="#FFFFFF" letter-spacing="3" text-anchor="middle" opacity="0.7">CÔNG TY CỔ PHẦN TẬP ĐOÀN SYNETIC</text></svg>